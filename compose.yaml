name: siftloom-local

services:
  postgres:
    image: postgres:17.9-alpine
    environment:
      POSTGRES_DB: siftloom
      POSTGRES_USER: siftloom_admin
      POSTGRES_PASSWORD: siftloom_admin_local_only
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U siftloom_admin -d siftloom"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - siftloom-postgres:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro

  s3mock:
    image: adobe/s3mock:5.1.0
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: siftloom-local
      COM_ADOBE_TESTING_S3MOCK_STORE_RETAIN_FILES_ON_EXIT: "true"
      COM_ADOBE_TESTING_S3MOCK_STORE_ROOT: containers3root
    ports:
      - "127.0.0.1:9090:9090"
      - "127.0.0.1:9191:9191"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/"]
      interval: 3s
      timeout: 3s
      retries: 30
    volumes:
      - siftloom-s3:/containers3root

volumes:
  siftloom-postgres:
  siftloom-s3:
